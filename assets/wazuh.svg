<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="430" gradientUnits="userSpaceOnUse">
    <stop stop-color="#070C12"/>
    <stop offset="0.5" stop-color="#0D1720"/>
    <stop offset="1" stop-color="#08151A"/>
  </linearGradient>

  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#FFFFFF" stop-opacity="0.14"/>
    <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.035"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.075"/>
  </linearGradient>

  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#86EFAC"/>
    <stop offset="0.5" stop-color="#22C55E"/>
    <stop offset="1" stop-color="#15803D"/>
  </linearGradient>

  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#67E8F9"/>
    <stop offset="1" stop-color="#0891B2"/>
  </linearGradient>

  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#22C55E" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#22C55E" stop-opacity="0.8"/>
    <stop offset="1" stop-color="#67E8F9" stop-opacity="0"/>
  </linearGradient>

  <filter id="blur">
    <feGaussianBlur stdDeviation="45"/>
  </filter>

  <filter id="shadow">
    <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
  </filter>

  <filter id="softGlow">
    <feGaussianBlur stdDeviation="10"/>
  </filter>

  <clipPath id="card">
    <rect x="30" y="25" width="1140" height="380" rx="32"/>
  </clipPath>

</defs>

<!-- BACKGROUND -->

<rect width="1200" height="430" rx="35" fill="url(#bg)"/>

<!-- AMBIENT GLOW -->

<circle
  cx="170"
  cy="90"
  r="135"
  fill="#22C55E"
  opacity="0.10"
  filter="url(#blur)"
/>

<circle
  cx="1040"
