<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="430" gradientUnits="userSpaceOnUse">
    <stop stop-color="#080B14"/>
    <stop offset="0.5" stop-color="#151126"/>
    <stop offset="1" stop-color="#09151A"/>
  </linearGradient>

  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#FFFFFF" stop-opacity="0.14"/>
    <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.035"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
  </linearGradient>

  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#E9D5FF"/>
    <stop offset="0.35" stop-color="#C084FC"/>
    <stop offset="1" stop-color="#7C3AED"/>
  </linearGradient>

  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#67E8F9"/>
    <stop offset="1" stop-color="#06B6D4"/>
  </linearGradient>

  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#C084FC" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#C084FC" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#67E8F9" stop-opacity="0"/>
  </linearGradient>

  <filter id="blur">
    <feGaussianBlur stdDeviation="45"/>
  </filter>

  <filter id="shadow">
    <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
  </filter>

  <clipPath id="card">
    <rect x="30" y="25" width="1140" height="380" rx="32"/>
  </clipPath>

</defs>

<!-- BACKGROUND -->

<rect width="1200" height="430" rx="35" fill="url(#bg)"/>

