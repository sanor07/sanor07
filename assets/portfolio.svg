<rect
  x="30"
  y="25"
  width="1140"
  height="380"
  rx="32"
  fill="url(#glass)"
  stroke="white"
  stroke-opacity="0.13"
  filter="url(#shadow)"
/>

<!-- REFLECTION -->

<g clip-path="url(#card)">
