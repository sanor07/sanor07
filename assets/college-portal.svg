<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="430">
    <stop stop-color="#080C14"/>
    <stop offset="0.5" stop-color="#101827"/>
    <stop offset="1" stop-color="#0B1218"/>
  </linearGradient>

  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#FFFFFF" stop-opacity="0.14"/>
    <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.035"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
  </linearGradient>

  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#93C5FD"/>
    <stop offset="0.5" stop-color="#3B82F6"/>
    <stop offset="1" stop-color="#1D4ED8"/>
  </linearGradient>

  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#67E8F9"/>
    <stop offset="1" stop-color="#0891B2"/>
  </linearGradient>

  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#3B82F6" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#60A5FA" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#67E8F9" stop-opacity="0"/>
  </linearGradient>

  <filter id="blur">
    <feGaussianBlur stdDeviation="45"/>
  </filter>

  <filter id="shadow">
    <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
  </filter>

  <clipPath id="card">
    <rect x="30" y="25" width="1140" height="380" rx="32"/>
  </clipPath>

</defs>

<!-- BACKGROUND -->

<rect width="1200" height="430" rx="35" fill="url(#bg)"/>

<!-- AMBIENT GLOW -->

<circle
  cx="150"
  cy="100"
  r="135"
  fill="#2563EB"
  opacity="0.13"
  filter="url(#blur)"
/>

<circle
  cx="1060"
  cy="330"
