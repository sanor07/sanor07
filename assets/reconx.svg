<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="430" gradientUnits="userSpaceOnUse">
    <stop stop-color="#080C14"/>
    <stop offset="0.5" stop-color="#111827"/>
    <stop offset="1" stop-color="#0B1020"/>
  </linearGradient>

  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#FFFFFF" stop-opacity="0.13"/>
    <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.035"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
  </linearGradient>

  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#67E8F9"/>
    <stop offset="1" stop-color="#06B6D4"/>
  </linearGradient>

  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#C084FC"/>
    <stop offset="1" stop-color="#7C3AED"/>
  </linearGradient>

  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#67E8F9" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#67E8F9" stop-opacity="0.8"/>
    <stop offset="1" stop-color="#C084FC" stop-opacity="0"/>
  </linearGradient>

  <filter id="blur">
    <feGaussianBlur stdDeviation="45"/>
  </filter>

  <filter id="shadow">
    <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.5"/>
  </filter>

  <filter id="glow">
    <feGaussianBlur stdDeviation="8"/>
  </filter>

  <clipPath id="card">
    <rect x="30" y="25" width="1140" height="380" rx="32"/>
  </clipPath>

</defs>

<!-- BACKGROUND -->

<rect width="1200" height="430" rx="35" fill="url(#bg)"/>

<!-- AMBIENT LIGHT -->

<circle cx="170" cy="90" r="120" fill="#06B6D4" opacity="0.13" filter="url(#blur)"/>

<circle cx="1030" cy="330" r="140" fill="#7C3AED" opacity="0.14" filter="url(#blur)"/>

<!-- MAIN GLASS -->

<rect
  x="30"
  y="25"
  width="1140"
  height="380"
  rx="32"
  fill="url(#glass)"
  stroke="white"
  stroke-opacity="0.13"
  filter="url(#shadow)"
/>

<!-- GLASS REFLECTION -->

<g clip-path="url(#card)">

  <path
    d="M0 35 L720 35 L470 220 L0 220 Z"
    fill="white"
    opacity="0.025"
  />

</g>

<!-- TOP LIGHT -->

<rect
