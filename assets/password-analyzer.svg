<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="430">
    <stop stop-color="#090B12"/>
    <stop offset="0.5" stop-color="#17121F"/>
    <stop offset="1" stop-color="#0B1118"/>
  </linearGradient>

  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#FFFFFF" stop-opacity="0.14"/>
    <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.035"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
  </linearGradient>

  <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#FDA4AF"/>
    <stop offset="0.5" stop-color="#F43F5E"/>
    <stop offset="1" stop-color="#BE123C"/>
  </linearGradient>

  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#E9D5FF"/>
    <stop offset="1" stop-color="#8B5CF6"/>
  </linearGradient>

  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#F43F5E" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#FB7185" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#C084FC" stop-opacity="0"/>
  </linearGradient>

  <filter id="blur">
    <feGaussianBlur stdDeviation="45"/>
  </filter>

  <filter id="shadow">
    <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
  </filter>

  <clipPath id="card">
    <rect x="30" y="25" width="1140" height="380" rx="32"/>
  </clipPath>

</defs>

<!-- BACKGROUND -->

<rect width="1200" height="430" rx="35" fill="url(#bg)"/>

<!-- AMBIENT GLOW -->

<circle
  cx="155"
  cy="95"
  r="135"
  fill="#F43F5E"
  opacity="0.10"
  filter="url(#blur)"
/>

<circle
  cx="1050"
  cy="325"
  r="140"
  fill="#8B5CF6"
  opacity="0.12"
  filter="url(#blur)"
/>

<!-- GLASS PANEL -->

<rect
  x="30"
  y="25"
  width="1140"
  height="380"
  rx="32"
  fill="url(#glass)"
  stroke="white"
  stroke-opacity="0.13"
  filter="url(#shadow)"
/>

<!-- REFLECTION -->

<g clip-path="url(#card)">
  <path
    d="M0 35 L760 35 L500 210 L0 210 Z"
    fill="white"
    opacity="0.025"
  />
</g>

