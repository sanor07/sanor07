<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360">
    <stop stop-color="#080B13"/>
    <stop offset="0.5" stop-color="#111827"/>
    <stop offset="1" stop-color="#0B101A"/>
  </linearGradient>

  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#FFFFFF" stop-opacity="0.14"/>
    <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.035"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
  </linearGradient>

  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#A5F3FC"/>
    <stop offset="0.5" stop-color="#22D3EE"/>
    <stop offset="1" stop-color="#0891B2"/>
  </linearGradient>

  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#E9D5FF"/>
    <stop offset="0.5" stop-color="#C084FC"/>
    <stop offset="1" stop-color="#7C3AED"/>
  </linearGradient>

  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#BFDBFE"/>
    <stop offset="1" stop-color="#3B82F6"/>
  </linearGradient>

  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#67E8F9" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#67E8F9" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#C084FC" stop-opacity="0"/>
  </linearGradient>

  <filter id="blur">
    <feGaussianBlur stdDeviation="45"/>
  </filter>

  <filter id="shadow">
    <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
  </filter>

  <clipPath id="card">
    <rect x="30" y="25" width="1140" height="310" rx="32"/>
  </clipPath>

</defs>

<!-- BACKGROUND -->

<rect width="1200" height="360" rx="35" fill="url(#bg)"/>

<!-- AMBIENT GLOW -->

<circle
  cx="170"
  cy="90"
  r="130"
  fill="#06B6D4"
  opacity="0.10"
  filter="url(#blur)"
/>

<circle
  cx="1040"
  cy="270"
  r="140"
  fill="#7C3AED"
  opacity="0.11"
  filter="url(#blur)"
/>

<!-- GLASS PANEL -->

<rect
  x="30"
  y="25"
  width="1140"
  height="310"
  rx="32"
  fill="url(#glass)"
  stroke="white"
  stroke-opacity="0.13"
  filter="url(#shadow)"
/>

<!-- REFLECTION -->

<g clip-path="url(#card)">
  <path
    d="M0 35 L760 35 L500 190 L0 190 Z"
    fill="white"
    opacity="0.025"
  />
</g>

<!-- TOP EDGE -->

<rect
  x="100"
  y="25"
  width="1000"
  height="2"
  rx="1"
  fill="url(#line)"
/>

<!-- HEADER -->

<text
