<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
    <stop stop-color="#0B1018"/>
    <stop offset="0.45" stop-color="#111827"/>
    <stop offset="1" stop-color="#0B0D18"/>
  </linearGradient>

  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="white" stop-opacity="0.13"/>
    <stop offset="0.5" stop-color="white" stop-opacity="0.04"/>
    <stop offset="1" stop-color="white" stop-opacity="0.08"/>
  </linearGradient>

  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#67E8F9"/>
    <stop offset="1" stop-color="#22D3EE"/>
  </linearGradient>

  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#C084FC"/>
    <stop offset="1" stop-color="#8B5CF6"/>
  </linearGradient>

  <filter id="blur">
    <feGaussianBlur stdDeviation="35"/>
  </filter>

  <filter id="shadow">
    <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
  </filter>

  <clipPath id="panel1">
    <rect x="35" y="35" width="550" height="290" rx="28"/>
  </clipPath>

  <clipPath id="panel2">
    <rect x="615" y="35" width="550" height="290" rx="28"/>
  </clipPath>

</defs>

<!-- Background -->

<rect width="1200" height="360" rx="32" fill="url(#bg)"/>

<!-- Ambient glow -->

<circle cx="130" cy="80" r="100" fill="#22D3EE" opacity="0.12" filter="url(#blur)"/>

<circle cx="1050" cy="270" r="120" fill="#A855F7" opacity="0.12" filter="url(#blur)"/>

<!-- LEFT GLASS PANEL -->

<rect
  x="35"
  y="35"
  width="550"
  height="290"
  rx="28"
  fill="url(#glass)"
  stroke="white"
  stroke-opacity="0.12"
  filter="url(#shadow)"
/>

<!-- Glass reflection -->

<g clip-path="url(#panel1)">
  <path
    d="M20 40 L580 40 L420 180 L20 180 Z"
    fill="white"
    opacity="0.025"
  />
</g>

<!-- LEFT ACCENT -->

<rect x="65" y="68" width="5" height="65" rx="2.5" fill="url(#cyan)"/>

<text
  x="90"
  y="88"
  fill="#67E8F9"
  font-family="monospace"
  font-size="15"
  letter-spacing="3"
>
ABOUT
</text>

<text
  x="90"
  y="125"
  fill="white"
  font-family="Arial, sans-serif"
  font-size="28"
  font-weight="700"
>
Sanowar Hussain
</text>

<text
  x="90"
  y="158"
  fill="#A7B0C0"
  font-family="Arial, sans-serif"
  font-size="15"
>
Cybersecurity • Python • OSINT
</text>

