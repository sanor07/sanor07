<line
  x1="90"
  y1="183"
  x2="530"
  y2="183"
  stroke="white"
  stroke-opacity="0.08"
/>

<!-- About text -->

<text
  x="90"
  y="214"
  fill="#CBD5E1"
  font-family="Arial, sans-serif"
  font-size="14"
