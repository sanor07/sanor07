      fill="#67E8F9" fill-opacity="0.08"
      stroke="#67E8F9" stroke-opacity="0.25"/>

<text x="142" y="283"
      text-anchor="middle"
      fill="#67E8F9"
      font-family="monospace"
      font-size="11">
DETECTION
</text>

<rect x="205" y="263" width="85" height="30" rx="15"
