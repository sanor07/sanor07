<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="260">
    <stop stop-color="#080B13"/>
    <stop offset="0.5" stop-color="#111827"/>
    <stop offset="1" stop-color="#0B101A"/>
  </linearGradient>

  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#A5F3FC"/>
    <stop offset="0.5" stop-color="#22D3EE"/>
    <stop offset="1" stop-color="#0891B2"/>
  </linearGradient>

  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#E9D5FF"/>
    <stop offset="0.5" stop-color="#C084FC"/>
    <stop offset="1" stop-color="#7C3AED"/>
  </linearGradient>

  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#67E8F9" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#67E8F9" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#C084FC" stop-opacity="0"/>
  </linearGradient>

  <filter id="blur">
    <feGaussianBlur stdDeviation="35"/>
  </filter>

</defs>

<!-- BACKGROUND -->

<rect width="1200" height="260" rx="32" fill="url(#bg)"/>

<!-- AMBIENT LIGHT -->

<circle
  cx="180"
  cy="210"
  r="110"
  fill="#06B6D4"
  opacity="0.10"
  filter="url(#blur)"
/>

<circle
  cx="1020"
  cy="50"
  r="110"
  fill="#7C3AED"
  opacity="0.10"
  filter="url(#blur)"
/>

<!-- TOP LIGHT -->

<rect
  x="80"
  y="35"
  width="1040"
  height="2"
  rx="1"
  fill="url(#line)"
/>

<!-- TERMINAL -->

<rect
  x="110"
  y="70"
  width="980"
  height="115"
  rx="22"
  fill="#FFFFFF"
  fill-opacity="0.035"
  stroke="white"
  stroke-opacity="0.10"
/>

<!-- TERMINAL DOTS -->

<circle cx="140" cy="96" r="5" fill="#F87171"/>
<circle cx="157" cy="96" r="5" fill="#FACC15"/>
<circle cx="174" cy="96" r="5" fill="#4ADE80"/>

<!-- TERMINAL COMMAND -->

<text
  x="140"
  y="132"
  fill="#67E8F9"
  font-family="monospace"
  font-size="13"
>
$ sudo whoami
</text>

<text
  x="140"
  y="157"
  fill="#E2E8F0"
  font-family="monospace"
  font-size="13"
>
sanowar_hussain
</text>

<!-- STATUS -->

<circle
  cx="950"
  cy="130"
  r="5"
  fill="#4ADE80"
/>

<text
  x="965"
  y="134"
  fill="#86EFAC"
  font-family="monospace"
  font-size="11"
>
SYSTEM ONLINE
</text>

<!-- FOOTER TEXT -->

<text
  x="600"
  y="215"
  text-anchor="middle"
  fill="#64748B"
  font-family="monospace"
  font-size="10"
  letter-spacing="3"
>
BUILD • BREAK • UNDERSTAND • SECURE
</text>

<text
  x="600"
  y="240"
  text-anchor="middle"
  fill="#334155"
  font-family="monospace"
  font-size="9"
>
SANOWAR HUSSAIN / CYBERSECURITY / PYTHON / OSINT
</text>

<!-- OUTER BORDER -->

<rect
  x="1"
  y="1"
  width="1198"
  height="258"
  rx="32"
  stroke="white"
  stroke-opacity="0.04"
/>

</svg>
